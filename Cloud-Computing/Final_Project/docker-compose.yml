version: '3.8'
services:
  zookeeper:
    image: zookeeper:3.8
    ports:
      - "2181:2181"

  node1:
    build: .
    environment:
      - NODE_ID=node1
      - ZK_HOST=zookeeper:2181
    depends_on:
      - zookeeper

  node2:
    build: .
    environment:
      - NODE_ID=node2
      - ZK_HOST=zookeeper:2181
    depends_on:
      - zookeeper

  node3:
    build: .
    environment:
      - NODE_ID=node3
      - ZK_HOST=zookeeper:2181
    depends_on:
      - zookeeper